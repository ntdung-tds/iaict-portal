name: HOLD - legacy one-time staging release quarantined

# This legacy workflow must NEVER deploy on push or manual invocation.
# Do not re-enable release through this file; use a separately reviewed
# immutable-SHA staging workflow only after explicit authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed - release authorization required
        run: |
          echo "::error::Legacy staging release workflow is quarantined. No Worker or D1 deployment is permitted."
          echo "::error::See docs/STAGING_RELEASE_BRANCH_QUARANTINE_2026-10-30.md"
          exit 1
