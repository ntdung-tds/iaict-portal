name: one-time-staging-cms-v17-release

# MANUAL only: an approved operator must trigger the exact staging release.
# No push-triggered deployments; preflight pins the live Worker and all 21 D1 migrations.
# No migration command, no data writes, and no production deployment.
on:
  workflow_dispatch:
    inputs:
      expected_worker_version:
        description: "Exact live staging Worker version (UUID) verified before release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iaict-portal-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.repository == 'ntdung-tds/iaict-portal' && github.ref == 'refs/heads/release/staging-v17-hardened-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: https://iaict-portal-staging.iaict-platform.workers.dev
      APP_ENV: staging
      APP_VERSION: ${{ github.sha }}
      IAICT_EXPECTED_STAGING_WORKER_VERSION: ${{ inputs.expected_worker_version }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify release target is exactly staging
        run: |
          test "$GITHUB_REF" = "refs/heads/release/staging-v17-hardened-20261029"
          test "$APP_ENV" = "staging"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "bad2f1dcbd36ca891c3e312d610a22cd"
          echo "Release commit: $GITHUB_SHA"
          echo "Target Worker: iaict-portal-staging"

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and test suite
        run: npm run verify

      - name: Verify live staging baseline and D1 are unchanged
        id: preflight
        run: node scripts/verify-staging-release.mjs
      - name: Verify public Access signing keys before changing Worker
        run: node scripts/verify-access-jwks-readiness.mjs

      - name: Build Cloudflare staging artifact
        run: npm run build:staging

      - name: Prepare Cloudflare module graph
        run: npm run prepare:cf-output

      - name: Deploy only staging Worker (NO D1 migrations)
        id: deploy
        run: IAICT_DEPLOY_TARGET=staging npx vinext-cloudflare deploy --env staging --skip-build

      - name: Verify public staging health after deployment
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error --max-time 25 "$STAGING_BASE_URL/api/health" > /tmp/staging-health.json
          node --input-type=module -e "import fs from 'node:fs'; const data=JSON.parse(fs.readFileSync('/tmp/staging-health.json','utf8')); if(data.status!=='ok') process.exit(1); console.log('Staging health response OK');"

      - name: Install Chromium for live acceptance
        run: npx playwright install --with-deps chromium

      - name: Run live browser acceptance tests on deployed staging
        run: npx playwright test --config playwright.staging.config.ts --workers=1

      # Test screenshots, videos, traces and HTML reports remain ephemeral on CI.
      # Do NOT upload QA assets to GitHub; retain only explicit individual PNGs in
      # the dedicated private Google Drive QA folder after authorized transfer.
      - name: Record staging release identity
        if: success()
        run: echo "STAGING RELEASE SUCCESS commit=$GITHUB_SHA target=iaict-portal-staging"
