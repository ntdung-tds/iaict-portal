name: portal-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical migrations
        run: node scripts/verify-migrations.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: vinext compatibility check
        run: npm run check:vinext
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build (Next.js)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime E2E smoke tests (Next.js)
        env:
          E2E_RUNTIME: next
        run: npm run test:e2e
      - name: Build Cloudflare Worker (OpenNext)
        run: npm run build:cloudflare
      - name: Runtime E2E smoke tests (Cloudflare Workers)
        env:
          E2E_RUNTIME: cloudflare
        run: npm run test:e2e
