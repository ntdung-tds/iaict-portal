name: portal-ci

on:
  push:
    branches: [main, ui-wow-production, ui-v15-consolidation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical migrations
        run: node scripts/verify-migrations.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: vinext compatibility check
        run: npm run check:vinext
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime E2E smoke tests
        run: npm run test:e2e
