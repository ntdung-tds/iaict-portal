name: portal-ci

on:
  push:
    branches: [main, ui-wow-production, ui-v15-consolidation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify canonical migrations
        run: node scripts/verify-migrations.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: vinext compatibility check
        run: npm run check:vinext
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Validate Cloudflare Build Output
        run: npx cf deploy --dry-run --prebuilt --mode production

  browser-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser-rendered contrast and SEO locally
        run: npx playwright test e2e/public-visual-seo.spec.ts --workers=1
      - name: Save Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-visual-seo-playwright
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
