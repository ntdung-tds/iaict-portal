name: portal-ci

on:
  push:
    branches: [main, ui-wow-production, ui-v15-consolidation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify canonical migrations
        run: node scripts/verify-migrations.mjs
      - name: Reject unsafe staging release and GitHub QA uploads
        run: npm run verify:release-safety
      - name: Verify immutable approved SHA and Worker/D1 rollback negative cases
        run: npm run verify:staging-rollback
      - name: Audit Cloudflare Access application root and path coverage
        run: npm run verify:access-paths
      - name: Prohibit authenticated session files and browser recording in CI
        run: npm run verify:auth-acceptance-safety
      - name: Independently probe live public Cloudflare Access signing keys
        run: node scripts/verify-access-jwks-readiness.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove authenticated Playwright suite refuses CI even during test discovery
        run: |
          if npx playwright test --config playwright.staging-authenticated.config.ts --list > /tmp/iaict-auth-guard.log 2>&1; then
            echo "::error::Authenticated Access tests unexpectedly accepted CI environment"
            exit 1
          fi
          if ! grep -q "AUTH_ACCEPTANCE_LOCAL_ONLY" /tmp/iaict-auth-guard.log; then
            echo "::error::Private-auth test discovery failed for an unexpected reason"
            exit 1
          fi
          echo "[auth-qa-safety] PASS: authenticated suite refuses CI test discovery"
      - name: vinext compatibility check
        run: npm run check:vinext
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Validate Cloudflare Build Output
        run: npx cf deploy --dry-run --prebuilt --mode production

  browser-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser-rendered contrast and SEO locally
        run: npx playwright test e2e/public-visual-seo.spec.ts e2e/cms-users-atomic.spec.ts e2e/cms-content-concurrency.spec.ts e2e/cms-articles-concurrency.spec.ts e2e/cms-news-review.spec.ts --workers=1
      # Test screenshots, videos, traces and HTML reports remain ephemeral on CI.
      # Do NOT upload QA assets to GitHub; retain only explicit individual PNGs in
      # the dedicated private Google Drive QA folder after authorized transfer.

  rc-ancestry:
    # An entirely separate verification of the complete Git history (round 2).
    # It does not deploy, write to D1, or create screenshot artifacts.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full Git graph for commit-ancestor verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Cross-check all reviewed PR commits, migration integrity and source contracts
        run: node scripts/verify-rc-integrity.mjs
      - name: Independently validate release triggers and QA media rules
        run: node scripts/verify-release-safety.mjs


  staging-release-go-no-go-audit:
    # Successful audit means the decision was CHECKED, not that release is GO.
    # Only an explicit, separate approval may authorize any staging deployment.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout complete candidate and release branch Git graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test GO/NO-GO policy independently
        run: node --test scripts/release-readiness.test.mjs
      - name: Audit actual current release branch workflows (NO DEPLOY)
        run: node scripts/audit-staging-release.mjs
