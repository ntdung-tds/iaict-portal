name: deploy-cloudflare-production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iaict-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      IAICT_ADMIN_PASSWORD: ${{ secrets.IAICT_ADMIN_PASSWORD }}
      IAICT_ADMIN_SESSION_SECRET: ${{ secrets.IAICT_ADMIN_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required production secrets
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BLOB_READ_WRITE_TOKEN IAICT_ADMIN_PASSWORD IAICT_ADMIN_SESSION_SECRET; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub production secret: $key"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify application
        run: npm run verify
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
      - name: Prepare encrypted Worker runtime secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const keys = ["BLOB_READ_WRITE_TOKEN", "IAICT_ADMIN_PASSWORD", "IAICT_ADMIN_SESSION_SECRET"];
          const payload = Object.fromEntries(keys.map((key) => [key, process.env[key]]));
          fs.writeFileSync("/tmp/iaict-cloudflare-secrets.json", JSON.stringify(payload), { mode: 0o600 });
          NODE
      - name: Deploy Cloudflare production
        run: npx opennextjs-cloudflare deploy -- --secrets-file=/tmp/iaict-cloudflare-secrets.json --keep-vars
      - name: Remove temporary secret file
        if: always()
        run: rm -f /tmp/iaict-cloudflare-secrets.json
