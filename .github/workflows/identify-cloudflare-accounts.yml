name: identify-cloudflare-accounts

on:
  workflow_dispatch:

permissions: {}

jobs:
  identify:
    name: Identify Cloudflare account (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    steps:
      - name: Identify account without exposing credentials or Account ID
        env:
          TARGET_ENVIRONMENT: ${{ matrix.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const target = process.env.TARGET_ENVIRONMENT;

          async function main() {
            if (!token || !accountId) {
              throw new Error("Required Cloudflare credentials are missing for this environment.");
            }
            if (!/^[a-f0-9]{32}$/i.test(accountId)) {
              throw new Error("Configured Cloudflare Account ID has an invalid format.");
            }

            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                },
                signal: AbortSignal.timeout(15000),
              },
            );

            if (!response.ok) {
              // Never print the API response: it may contain account identifiers.
              throw new Error(
                `Cloudflare account lookup failed (HTTP ${response.status}). Check token permissions.`,
              );
            }

            const data = await response.json();
            if (
              data?.success !== true ||
              data?.result?.id !== accountId ||
              typeof data?.result?.name !== "string"
            ) {
              throw new Error("Cloudflare returned an invalid account lookup response.");
            }

            // Check that the staging credentials point to the expected workers.dev
            // subdomain and an enabled staging Worker, not merely an account with a name.
            if (target === "staging") {
              const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
              const headers = { Authorization: `Bearer ${token}`, Accept: "application/json" };

              const subdomainResponse = await fetch(`${base}/workers/subdomain`, {
                headers,
                signal: AbortSignal.timeout(15000),
              });
              if (!subdomainResponse.ok) {
                throw new Error("Cloudflare Workers subdomain lookup failed; check token permissions.");
              }
              const subdomainData = await subdomainResponse.json();
              if (subdomainData?.success !== true || subdomainData?.result?.subdomain !== "iaict-platform") {
                throw new Error("Staging credentials do not match workers.dev subdomain iaict-platform.");
              }

              const workerResponse = await fetch(`${base}/workers/scripts/iaict-portal-staging/subdomain`, {
                headers,
                signal: AbortSignal.timeout(15000),
              });
              if (!workerResponse.ok) {
                throw new Error("Could not verify the staging Worker in this account.");
              }
              const workerData = await workerResponse.json();
              if (workerData?.success !== true || workerData?.result?.enabled !== true) {
                throw new Error("Staging Worker is not enabled on workers.dev in this account.");
              }
              console.log("Verified staging URL: https://iaict-portal-staging.iaict-platform.workers.dev");
            }

            console.log(`GitHub environment: ${target}`);
            console.log(`Cloudflare account name: ${JSON.stringify(data.result.name)}`);
          }

          main().catch((error) => {
            // Print only controlled messages; never expose fetched response bodies.
            const knownMessages = [
              "Required Cloudflare credentials are missing for this environment.",
              "Configured Cloudflare Account ID has an invalid format.",
              "Cloudflare returned an invalid account lookup response.",
              "Cloudflare Workers subdomain lookup failed; check token permissions.",
              "Staging credentials do not match workers.dev subdomain iaict-platform.",
              "Could not verify the staging Worker in this account.",
              "Staging Worker is not enabled on workers.dev in this account.",
            ];
            const message =
              knownMessages.includes(error.message) ||
              /^Cloudflare account lookup failed \(HTTP [0-9]{3}\)\. Check token permissions\.$/.test(error.message)
                ? error.message
                : "Cloudflare account lookup failed due to a network or unexpected error.";
            console.error(message);
            process.exitCode = 1;
          });
          NODE
