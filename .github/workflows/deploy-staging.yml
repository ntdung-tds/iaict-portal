name: deploy-staging

# Manual, explicitly version-pinned, release-branch-only. No migrations or
# QA media uploaded to GitHub. Only run after user-approved staging release.
on:
  workflow_dispatch:
    inputs:
      expected_worker_version:
        description: "Exact currently deployed staging Worker version (UUID)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iaict-portal-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ntdung-tds/iaict-portal' && github.ref == 'refs/heads/release/staging-v17-hardened-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IAICT_EXPECTED_STAGING_WORKER_VERSION: ${{ inputs.expected_worker_version }}
      IAICT_DEPLOY_TARGET: staging
      APP_ENV: staging
      APP_VERSION: ${{ github.sha }}
      STAGING_BASE_URL: https://iaict-portal-staging.iaict-platform.workers.dev
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify release credentials and pinned target
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = "bad2f1dcbd36ca891c3e312d610a22cd"
          test "$IAICT_DEPLOY_TARGET" = "staging"
          test -n "$IAICT_EXPECTED_STAGING_WORKER_VERSION"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify migrations and application
        run: npm run verify
      - name: Read-only live Worker and D1 preflight
        run: node scripts/verify-staging-release.mjs
      - name: Verify public Access signing keys before changing Worker
        run: node scripts/verify-access-jwks-readiness.mjs
      - name: Build staging only
        run: npm run build:staging
      - name: Prepare Cloudflare module graph
        run: npm run prepare:cf-output
      - name: Deploy staging Worker without D1 migrations
        run: IAICT_DEPLOY_TARGET=staging npx vinext-cloudflare deploy --env staging --skip-build
      - name: Verify staging health
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error --max-time 25 "$STAGING_BASE_URL/api/health" > /tmp/staging-health.json
          node --input-type=module -e "import fs from 'node:fs'; if(JSON.parse(fs.readFileSync('/tmp/staging-health.json','utf8')).status!=='ok') process.exit(1)"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Live staging Chromium acceptance, QA files remain ephemeral
        run: npx playwright test --config playwright.staging.config.ts --workers=1
