name: staging-acceptance

on:
  pull_request:
  push:
    branches: [ui-v16-functional]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_BASE_URL: https://iaict-portal-staging.iaict-platform.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live staging acceptance
        run: npx playwright test --config playwright.staging.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-report
          path: |
            playwright-report-staging
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Save live Chromium screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-screenshots
          path: browser-evidence/staging
          if-no-files-found: ignore
          retention-days: 7
