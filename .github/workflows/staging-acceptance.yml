name: staging-acceptance

on:
  pull_request:
  push:
    branches: [ui-v16-functional]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_BASE_URL: https://iaict-portal-staging.iaict-platform.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live staging acceptance
        run: npx playwright test --config playwright.staging.config.ts
      - name: Probe repeated staging availability without hiding a transient 503
        run: node scripts/staging-availability-probe.mjs
      # Test screenshots, videos, traces and HTML reports remain ephemeral on CI.
      # Do NOT upload QA assets to GitHub; retain only explicit individual PNGs in
      # the dedicated private Google Drive QA folder after authorized transfer.