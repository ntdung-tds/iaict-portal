name: Deploy IAICT UI preview to GitHub Pages

on:
  push:
    branches:
      - ui-wow-production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iaict-ui-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify migrations
        run: npm run verify:migrations

      - name: Build static public preview
        run: npx vinext build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        id: export
        shell: bash
        run: |
          set -euo pipefail
          PAGES_DIR="dist/client/iaict-portal"
          test -f "$PAGES_DIR/index.html"
          touch "$PAGES_DIR/.nojekyll"
          if [ -f dist/client/404/index.html ]; then
            cp dist/client/404/index.html "$PAGES_DIR/404.html"
          fi
          echo "pages_dir=$PAGES_DIR" >> "$GITHUB_OUTPUT"
          echo "Using GitHub Pages artifact: $PAGES_DIR"
          find "$PAGES_DIR" -maxdepth 2 -type f | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.pages_dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
