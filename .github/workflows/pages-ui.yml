name: Deploy IAICT UI preview to GitHub Pages

on:
  push:
    branches:
      - ui-wow-production
      - cms/v17-full-admin
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iaict-ui-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify migrations
        run: npm run verify:migrations

      - name: Build static public preview
        shell: bash
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: "https://ntdung-tds.github.io/iaict-portal/"
          NEXT_PUBLIC_INDEXABLE_SITE: "false"
          NEXT_PUBLIC_STATIC_PREVIEW: "true"
          NEXT_PUBLIC_CMS_URL: "https://iaict-portal-staging.iaict-platform.workers.dev/admin"
        run: |
          set -euo pipefail
          mv cloudflare.config.ts cloudflare.config.ts.pages-disabled
          node scripts/prepare-pages-preview.mjs
          npx vinext build

      - name: Prepare GitHub Pages artifact
        id: export
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "dist/client/iaict-portal/index.html" ]; then
            EXPORT_DIR="dist/client/iaict-portal"
          elif [ -f "dist/client/index.html" ]; then
            EXPORT_DIR="dist/client"
          else
            echo "Static export index.html not found"
            find dist/client -maxdepth 4 -type f | head -160 || true
            exit 1
          fi

          PAGES_DIR=".pages-artifact"
          test -d "$EXPORT_DIR/_next"

          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"
          cp -a "$EXPORT_DIR"/. "$PAGES_DIR"/

          touch "$PAGES_DIR/.nojekyll"
          GITHUB_PAGES=true NEXT_PUBLIC_CMS_URL=https://iaict-portal-staging.iaict-platform.workers.dev/admin node scripts/prepare-pages-preview.mjs --artifact "$PAGES_DIR"
          if [ ! -f "$PAGES_DIR/404.html" ]; then
            if [ -f dist/client/404.html ]; then
              cp dist/client/404.html "$PAGES_DIR/404.html"
            elif [ -f dist/client/404/index.html ]; then
              cp dist/client/404/index.html "$PAGES_DIR/404.html"
            fi
          fi

          # Never publish an unstyled/unhydrated HTML-only artifact again.
          test -n "$(find "$PAGES_DIR/_next/static/css" -type f -name '*.css' -print -quit)"
          test -n "$(find "$PAGES_DIR/_next/static/chunks" -type f -name '*.js' -print -quit)"

          echo "pages_dir=$PAGES_DIR" >> "$GITHUB_OUTPUT"
          echo "Using static GitHub Pages artifact: $PAGES_DIR"
          echo "CSS files: $(find "$PAGES_DIR/_next/static/css" -type f -name '*.css' | wc -l)"
          echo "JS files: $(find "$PAGES_DIR/_next/static/chunks" -type f -name '*.js' | wc -l)"
          find "$PAGES_DIR" -maxdepth 4 -type f | head -160

      - name: Check CMS data in the exported Pages UI
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-pages-cms.mjs .pages-artifact

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.export.outputs.pages_dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
