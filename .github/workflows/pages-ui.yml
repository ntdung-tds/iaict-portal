name: Deploy IAICT UI preview to GitHub Pages

on:
  push:
    branches:
      - ui-wow-production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iaict-ui-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify migrations
        run: npm run verify:migrations

      - name: Build static public preview
        run: npx vinext build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        id: export
        shell: bash
        run: |
          set -euo pipefail

          HTML_DIR="dist/client/iaict-portal"
          ASSET_DIR=".cloudflare/output/v0/workers/default/assets/iaict-portal"
          PAGES_DIR=".pages-artifact"

          test -f "$HTML_DIR/index.html"
          test -d "$ASSET_DIR/_next"

          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"

          # Vinext emits prerendered route HTML and browser assets into separate
          # output trees. GitHub Pages needs both trees merged at the site root.
          cp -a "$ASSET_DIR"/. "$PAGES_DIR"/
          cp -a "$HTML_DIR"/. "$PAGES_DIR"/

          touch "$PAGES_DIR/.nojekyll"
          if [ -f dist/client/404/index.html ]; then
            cp dist/client/404/index.html "$PAGES_DIR/404.html"
          fi

          # Never publish an unstyled/unhydrated HTML-only artifact again.
          test -n "$(find "$PAGES_DIR/_next/static/css" -type f -name '*.css' -print -quit)"
          test -n "$(find "$PAGES_DIR/_next/static/chunks" -type f -name '*.js' -print -quit)"

          echo "pages_dir=$PAGES_DIR" >> "$GITHUB_OUTPUT"
          echo "Using complete GitHub Pages artifact: $PAGES_DIR"
          echo "CSS files: $(find "$PAGES_DIR/_next/static/css" -type f -name '*.css' | wc -l)"
          echo "JS files: $(find "$PAGES_DIR/_next/static/chunks" -type f -name '*.js' | wc -l)"
          find "$PAGES_DIR" -maxdepth 4 -type f | head -160

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.pages_dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
